services:
  relational:
    image: postgres:17
    command:
      - postgres
      - -c
      - max_connections=500
    environment:
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
      POSTGRES_DB: fhir
    ports:
      - "${FHIR_RELATIONAL_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhir"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  document:
    image: mongo:7
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${FHIR_DOCUMENT_PORT:-27017}:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  service:
    build:
      context: .
      dockerfile: Containerfile
    profiles: ["service", "conformance"]
    environment:
      FHIR_BIND: 0.0.0.0:8080
      FHIR_BACKEND: ${FHIR_BACKEND:-relational}
      FHIR_VERSION: ${FHIR_VERSION:-R4}
      FHIR_DATABASE_URL: ${FHIR_DATABASE_URL:-postgres://fhir:fhir@relational:5432/fhir}
      FHIR_DOCUMENT_URL: ${FHIR_DOCUMENT_URL:-mongodb://document:27017/?directConnection=true}
      FHIR_CONTINUATION_KEY: ${FHIR_CONTINUATION_KEY:-}
      FHIR_STORE_CONNECTIONS: ${FHIR_STORE_CONNECTIONS:-8}
      FHIR_AUTH_ISSUER: ${FHIR_AUTH_ISSUER:-}
      FHIR_AUTH_AUTHORIZE: ${FHIR_AUTH_AUTHORIZE:-}
      FHIR_AUTH_TOKEN: ${FHIR_AUTH_TOKEN:-}
      FHIR_AUTH_INTROSPECT: ${FHIR_AUTH_INTROSPECT:-}
      FHIR_AUTH_JWKS: ${FHIR_AUTH_JWKS:-}
      FHIR_AUTH_AUDIENCE: ${FHIR_AUTH_AUDIENCE:-}
      FHIR_AUTH_SCOPES: ${FHIR_AUTH_SCOPES:-}
      FHIR_AUTH_CAPABILITIES: ${FHIR_AUTH_CAPABILITIES:-}
    ports:
      - "${FHIR_PORT:-8080}:8080"
    depends_on:
      relational:
        condition: service_healthy
      document:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/probe", "127.0.0.1:8080"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  issuer:
    image: quay.io/keycloak/keycloak:26.0.8
    profiles: ["conformance"]
    command:
      - start-dev
      - --import-realm
      - --https-certificate-file=/tls/issuer.pem
      - --https-certificate-key-file=/tls/issuer-key.pem
      - --https-port=8443
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${FHIR_ISSUER_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FHIR_ISSUER_PASSWORD:-admin}
    volumes:
      - ./ci/conformance/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./scratch/conformance/tls:/tls:ro
    ports:
      - "${FHIR_ISSUER_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
