



[graph]
all-features = true

[advisories]

yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin attack on rsa 0.9: a timing sidechannel that leaks an RSA private key to an observer of RSA private-key operations. This service holds no RSA private key: jsonwebtoken reaches it only to verify a signature against the public key an issuer publishes, and R-13 already refuses a symmetric algorithm from an issuer. The only private key in this tree is the one core/src/security/fixture.rs generates inside a test. No patched release exists (upstream: RustCrypto/RSA#626). Reviewed 2026-09-14; revisit when rsa 0.10 ships or when jsonwebtoken drops the dependency." },
]

[licenses]



allow = [
    
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"



wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
