[package]
name = "fhir-api"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8"
fhir-core = { path = "../core" }
fhir-store = { path = "../store" }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt", "net", "sync", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
fhir-adapter-memory = { path = "../adapter-memory" }
fhir-jobs = { path = "../jobs" }
fhir-store-contract = { path = "../contract" }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }