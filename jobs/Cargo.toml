[package]
name = "fhir-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
fhir-core = { path = "../core" }
fhir-store = { path = "../store" }
fhir-telemetry = { path = "../telemetry" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
fhir-telemetry = { path = "../telemetry" }
fhir-adapter-memory = { path = "../adapter-memory" }
fhir-store-contract = { path = "../contract" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
fhir-adapter-relational = { path = "../adapter-relational" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
