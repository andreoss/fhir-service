[package]
name = "fhir-adapter-memory"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
async-trait = "0.1"
fhir-core = { path = "../core" }
fhir-store = { path = "../store" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }


[dev-dependencies]
fhir-store-contract = { path = "../contract" }
tokio = { version = "1", features = ["macros", "rt"] }