[package]
name = "fhir-adapter-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
fhir-core = { path = "../core" }
fhir-store = { path = "../store" }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }