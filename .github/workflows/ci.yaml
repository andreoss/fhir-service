name: ci

on:
  push:
    branches: ["master"]
  pull_request:

env:
  FHIR_IMAGE: fhir-service:${{ github.sha }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: format
        run: cargo fmt --all --check
      - name: analysis
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: engines
        run: docker compose up -d --wait
      - name: test
        run: cargo test --workspace
      - name: image
        run: docker build --file Containerfile --tag "$FHIR_IMAGE" .
      - name: publish
        if: github.ref == 'refs/heads/master'
        env:
          FHIR_REGISTRY: ${{ vars.FHIR_REGISTRY }}
        run: |
          if [ -z "${FHIR_REGISTRY:-}" ]; then
            echo "publish skipped: no registry named"
            exit 0
          fi
          docker tag "$FHIR_IMAGE" "$FHIR_REGISTRY/$FHIR_IMAGE"
          docker push "$FHIR_REGISTRY/$FHIR_IMAGE"
      - name: engines down
        if: always()
        run: docker compose down -v
