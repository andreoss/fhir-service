name: ci

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-cyclonedx
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: tools the definition names
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git openssl && docker --version
      - name: pipeline
        run: sh ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bill-of-materials
          path: |
            scratch/bill-of-materials.json
            scratch/bill-of-materials.txt
