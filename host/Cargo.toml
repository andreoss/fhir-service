[package]
name = "fhir-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
fhir-adapter-document = { path = "../adapter-document", optional = true }
fhir-adapter-memory = { path = "../adapter-memory", optional = true }
fhir-adapter-relational = { path = "../adapter-relational", optional = true }
fhir-api = { path = "../api" }
fhir-core = { path = "../core" }
fhir-jobs = { path = "../jobs" }
fhir-store = { path = "../store" }
fhir-telemetry = { path = "../telemetry" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

[features]
default = ["backend-memory", "backend-relational", "backend-document"]
backend-memory = ["dep:fhir-adapter-memory"]
backend-relational = ["dep:fhir-adapter-relational"]
backend-document = ["dep:fhir-adapter-document"]

[dev-dependencies]
fhir-core = { path = "../core", features = ["fixtures"] }
fhir-shadow = { path = "../shadow" }
fhir-tools = { path = "../tools/tools" }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
mongodb = "3"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }