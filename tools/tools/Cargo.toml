[package]
name = "fhir-tools"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
async-trait = "0.1"
fhir-adapter-memory = { path = "../../adapter-memory" }
fhir-core = { path = "../../core" }
fhir-host = { path = "../../host" }
fhir-jobs = { path = "../../jobs" }
fhir-shadow = { path = "../../shadow" }
fhir-store = { path = "../../store" }
fhir-telemetry = { path = "../../telemetry" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
fhir-api = { path = "../../api" }
fhir-adapter-document = { path = "../../adapter-document" }
fhir-adapter-relational = { path = "../../adapter-relational" }
fhir-store-contract = { path = "../../contract" }
mongodb = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
