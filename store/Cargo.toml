[package]
name = "fhir-store"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
fhir-core = { path = "../core" }
flate2 = "1"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
